info:
  name: List all bikes
  type: http
  seq: 1
  tags:
    - Bikes

http:
  method: GET
  url: "{{baseUrl}}/bikes/"
  params:
    - name: page
      value: ""
      type: query
      description: A page number within the paginated result set.
      disabled: true
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
