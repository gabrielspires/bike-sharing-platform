info:
  name: Finish a trip
  type: http
  seq: 2
  tags:
    - Trips

http:
  method: PATCH
  url: "{{baseUrl}}/trips/:id/finish/"
  params:
    - name: id
      value: 01a09c55-03be-7102-9dd5-804be7c15a15
      type: path
  body:
    type: json
    data: |-
      {
        "score": 3,
        "finish_station": "01a09c42-8d62-71ad-a615-ede028ae6c9a"
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    request:
      url: "{{baseUrl}}/trips/:id/finish/"
