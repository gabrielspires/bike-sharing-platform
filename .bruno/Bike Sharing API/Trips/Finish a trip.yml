        data: |-
          {
            "id": "",
            "user": "",
            "category": "",
            "created_at": "",
            "updated_at": "",
            "finished_at": "",
            "score": 0
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
