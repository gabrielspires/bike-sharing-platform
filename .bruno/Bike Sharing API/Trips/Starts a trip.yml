info:
  name: Starts a trip
  type: http
  seq: 4
  tags:
    - Trips

http:
  method: POST
  url: "{{baseUrl}}/trips/start/"
  body:
    type: json
    data: |-
      {
        "category": "3",
        "bike": "01a0889e-929e-718f-a967-4317fd772ca4"  
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    request:
      url: "{{baseUrl}}/trips/start/"
      method: POST
      body:
        type: json
        data: |-
          {
            "id": "",
            "user": "",
            "category": "",
            "created_at": "",
            "updated_at": "",
            "finished_at": "",
            "score": 0
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "id": "",
            "user": "",
            "category": "",
            "created_at": "",
            "updated_at": "",
            "finished_at": "",
            "score": 0
          }

docs: Starts a trip and change the status of the bike used.
