http:
  method: GET
  url: "{{baseUrl}}/users/:user_id/trips/"
  params:
    - name: user_id
      value: 01a0889d-a903-71ed-a1f6-46ab5543cf2f
      type: path
    - name: page
      value: ""
      type: query
