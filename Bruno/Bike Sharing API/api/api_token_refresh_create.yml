info:
  name: api_token_refresh_create
  type: http
  seq: 2
  tags:
    - api

http:
  method: POST
  url: "{{baseUrl}}/api/token/refresh/"
  body:
    type: json
    data: |-
      {
        "refresh": "{{refreshToken}}"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 200 && res.body) {
          if (res.body.access) {
            bru.setEnvVar("token", res.body.access);
          }
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    request:
      url: "{{baseUrl}}/api/token/refresh/"
      method: POST
      body:
        type: json
        data: |-
          {
            "access": "",
            "refresh": ""
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "access": "",
            "refresh": ""
          }

docs: |-
  Takes a refresh type JSON web token and returns an access type JSON web
  token if the refresh token is valid.
