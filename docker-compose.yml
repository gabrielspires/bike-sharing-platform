services:
  db:
    image: postgres:17.10-alpine3.24
    container_name: bsp_database
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - bsp_database_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bsp_network

  rabbitmq:
    image: rabbitmq:4.2.9-management-alpine
    container_name: bsp_rabbitmq
    # Shell delay sequence to wait for volume creation
    entrypoint: ["sh", "-c", "sleep 2 && exec docker-entrypoint.sh rabbitmq-server"]
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER:-guest}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD:-guest}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - bsp_rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bsp_network

  opensearch:
    image: opensearchproject/opensearch:3.8.0
    container_name: bsp_opensearch
    environment:
      - cluster.name=bsp-log-cluster
      - node.name=bsp-opensearch
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - plugins.security.disabled=true
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${OPENSEARCH_INITIAL_ADMIN_PASSWORD}
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "${OPENSEARCH_PORT:-9200}:9200"
    volumes:
      - bsp_opensearch_data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9200/').read()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - bsp_network

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:3.8.0
    container_name: bsp_dashboards
    environment:
      - OPENSEARCH_HOSTS=["http://opensearch:9200"]
      - DISABLE_SECURITY_DASHBOARDS_PLUGIN=true
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${OPENSEARCH_INITIAL_ADMIN_PASSWORD}
    ports:
      - "${DASHBOARDS_PORT:-5601}:5601"
    depends_on:
      opensearch:
        condition: service_healthy
    networks:
      - bsp_network

  bike_sharing_api:
    image: bike-sharing-platform:latest
    build: .
    container_name: bsp_api
    command: >
      bash -c "poetry run python manage.py migrate &&
      poetry run python manage.py runserver 0.0.0.0:8000"
    environment:
      - DB_HOST=db
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_PORT=${DB_PORT}
      - DJANGO_SETTINGS_MODULE=${DJANGO_SETTINGS_MODULE}
      - SECRET_KEY=${SECRET_KEY}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
      - RABBITMQ_USER=${RABBITMQ_USER}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}
      - RABBITMQ_PORT=${RABBITMQ_PORT}
      - RABBITMQ_MANAGEMENT_PORT=${RABBITMQ_MANAGEMENT_PORT}
      - RABBITMQ_HOST=rabbitmq
      - TRIP_CONFIRMATION_SENDER=${TRIP_CONFIRMATION_SENDER}
      # New environment variable to point Django to your internal docker service container
      - OPENSEARCH_HOST=opensearch
      - OPENSEARCH_PORT=9200
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      opensearch:
        condition: service_healthy # Ensure OpenSearch is ready before API launches
    networks:
      - bsp_network

  celery_worker:
    image: bike-sharing-platform:latest
    build: .
    container_name: bsp_celery_worker
    command: poetry run celery -A config worker -l info
    environment:
      - DJANGO_SETTINGS_MODULE=${DJANGO_SETTINGS_MODULE}
      - SECRET_KEY=${SECRET_KEY}
      - CELERY_BROKER_URL=amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672//
      - DB_HOST=db
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      # Include OpenSearch credentials if you want your worker to push logs too
      - OPENSEARCH_HOST=opensearch
      - OPENSEARCH_PORT=9200
    depends_on:
      rabbitmq:
        condition: service_healthy
      db:
        condition: service_healthy
      opensearch:
        condition: service_healthy
    networks:
      - bsp_network

  flower:
    image: bike-sharing-platform:latest
    build: .
    container_name: bsp_flower
    command: >
      poetry run celery -A config flower 
      --broker_api="http://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:15672/api/"
    ports:
      - "${FLOWER_PORT:-5555}:5555"
    environment:
      - DJANGO_SETTINGS_MODULE=${DJANGO_SETTINGS_MODULE}
      - CELERY_BROKER_URL=amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672//
      - FLOWER_BASIC_AUTH=${FLOWER_USER}:${FLOWER_PASSWORD}
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - bsp_network

volumes:
  bsp_database_data:
  bsp_rabbitmq_data:
  bsp_opensearch_data: # New volume to store logs through container restarts

networks:
  bsp_network:
    driver: bridge
